<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>联系电话</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #fff;
        }
        .name {
            font-size: 22px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 30px;
        }
        .phone-number {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            letter-spacing: 2px;
            margin-bottom: 30px;
            font-family: "SF Mono", Monaco, monospace;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-call {
            background: #07c160;
            color: #fff;
            box-shadow: 0 4px 12px rgba(7,193,96,0.3);
        }
        .btn-sms {
            background: #576b95;
            color: #fff;
            box-shadow: 0 4px 12px rgba(87,107,149,0.3);
        }
        .btn-copy {
            background: #f5f5f5;
            color: #333;
            border: 1px solid #e0e0e0;
        }
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">📞</div>
        <div class="name">联系电话</div>
        <div class="subtitle">点击按钮即可拨打或发送短信</div>
        <div class="phone-number">182 4216 7359</div>
        
        <a href="tel:18242167359" class="btn btn-call">📞 拨打电话</a>
        <a href="sms:18242167359" class="btn btn-sms">✉️ 发送短信</a>
        <button class="btn btn-copy" onclick="copyNumber()">📋 复制号码</button>
        
        <div class="footer">手机端点击可直接唤起拨号/短信界面</div>
    </div>
    
    <div class="toast" id="toast">号码已复制</div>
    
    <script>
        function copyNumber(){
            var num = "18242167359";
            if(navigator.clipboard){
                navigator.clipboard.writeText(num);
            } else {
                var input = document.createElement("input");
                input.value = num;
                document.body.appendChild(input);
                input.select();
                document.execCommand("copy");
                document.body.removeChild(input);
            }
            var toast = document.getElementById("toast");
            toast.classList.add("show");
            setTimeout(function(){
                toast.classList.remove("show");
            }, 2000);
        }
    </script>
</body>
</html>
